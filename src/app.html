<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A web app to calculate cocktails for specific events"
    />
    <meta name="keywords" content="cocktail, calculation, recipe" />
    <meta name="theme-color" content="#80F" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="%sveltekit.assets%/favicon/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="%sveltekit.assets%/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="%sveltekit.assets%/favicon/favicon-16x16.png"
    />
    <link rel="icon" href="%sveltekit.assets%/favicon/favicon.ico" />
    <link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
    %sveltekit.head%
  </head>
  <body
    data-sveltekit-preload-data="hover"
    class="bg-white font-poppins text-secondary-900 selection:bg-primary-100 dark:bg-secondary-900 dark:text-white dark:selection:bg-primary-800"
  >
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
