name: Release app

# Builds the Tauri desktop app for macOS (universal), Linux and Windows and
# attaches the bundles to a draft GitHub release. Triggered by pushing a tag
# like `v1.2.0` (the version in src-tauri/tauri.conf.json should match) or
# manually, in which case the release is named after the app version.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            platform: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - name: Linux
            platform: ubuntu-22.04
            targets: ''
            args: ''
          - name: Windows
            platform: windows-latest
            targets: ''
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # --ignore-scripts: the app does not need the native better-sqlite3 module
      # (server only) and node-gyp has no working toolchain on the Windows runner
      - run: pnpm install --frozen-lockfile --ignore-scripts

      # runs `tauri build` (including beforeBuildCommand `pnpm build:app`) and
      # uploads the bundles to the release
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'app-v__VERSION__' }}
          releaseName: "CocktailCalc ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}"
          releaseBody: |
            Desktop app for macOS, Linux and Windows. The builds are not code-signed yet:
            on macOS open via right click → Open, on Windows confirm the SmartScreen dialog.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
