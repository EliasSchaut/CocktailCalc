services:
  app:
    build: .
    image: kidilias/cocktailcalc:latest
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      # public URL the app is reached at (needed for correct absolute URLs)
      ORIGIN: ${ORIGIN:-http://localhost:3000}
    volumes:
      - data:/data

volumes:
  data:
